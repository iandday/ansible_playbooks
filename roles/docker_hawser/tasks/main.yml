---
#
# roles/docker_hawser/tasks/main.yml
#

- name: create compose directory
  become: true
  file:
    path: "{{ docker_hawser_docker_builds }}/hawser"
    state: directory
    owner: "{{ docker_uid }}"
    group: "{{ docker_gid }}"
    mode: 0700

- name: check for Hawser credential file
  become: true
  ansible.builtin.stat:
    path: "{{ docker_hawser_credentials_path }}"
  register: hawser_credentials_file

- name: Authenticate to Dockhand and get a session cookie
  ansible.builtin.uri:
    url: "https://dockhand.{{ all_ext_domain }}/api/auth/login"
    method: POST
    status_code: 200
    body_format: json
    body:
      username: "{{ vault_docker_dockhand_admin_username }}"
      password: "{{ vault_docker_dockhand_admin_password }}"
    validate_certs: false
  delegate_to: localhost
  register: login_response
  when: not hawser_credentials_file.stat.exists

- name: Create the Edge Environment in Dockhand
  ansible.builtin.uri:
    url: "https://dockhand.{{ all_ext_domain }}/api/environments"
    method: POST
    status_code: 200
    body_format: json
    headers:
      Cookie: "{{ login_response.set_cookie }}"
    body:
      name: "{{ inventory_hostname }}"
      connectionType: "hawser-edge"
    validate_certs: false
  delegate_to: localhost
  register: create_env_response
  when: not hawser_credentials_file.stat.exists

- name: Generate the Edge Connection Token
  ansible.builtin.uri:
    url: "https://dockhand.{{ all_ext_domain }}/api/hawser/tokens"
    method: POST
    status_code: 200
    headers:
      Cookie: "{{ login_response.set_cookie }}"
      Content-Type: "application/json"
    body_format: raw
    body: >
      {{ {
        'name': inventory_hostname,
        'environmentId': create_env_response.json.id | int
      } | to_json }}
    validate_certs: false
  delegate_to: localhost
  register: token_response
  when: not hawser_credentials_file.stat.exists

- name: Create hawser token from Dockhand response
  ansible.builtin.set_fact:
    docker_hawser_token: "{{ token_response.json.token }}"
  when: not hawser_credentials_file.stat.exists

- name: Write hawser credentials file
  become: true
  ansible.builtin.template:
    src: "credential.yml.j2"
    dest: "{{ docker_hawser_credentials_path }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: not hawser_credentials_file.stat.exists

- name: Read hawser credentials from file
  become: true
  ansible.builtin.slurp:
    src: "{{ docker_hawser_credentials_path }}"
  register: hawser_creds_content
  when: hawser_credentials_file.stat.exists

- name: Define variables from file
  ansible.builtin.set_fact:
    hawser_creds: "{{ hawser_creds_content.content | b64decode | from_yaml }}"
  when: hawser_credentials_file.stat.exists

- name: Set hawser variables from loaded file
  ansible.builtin.set_fact:
    docker_hawser_token: "{{ hawser_creds.docker_hawser_token }}"
  when: hawser_credentials_file.stat.exists

- name: copy docker files
  become: true
  template:
    src: "{{ item }}.j2"
    dest: "{{ docker_hawser_docker_builds }}/hawser/{{ item }}"
    backup: true
    owner: "{{ docker_uid }}"
    group: "{{ docker_gid }}"
    mode: 0700
  loop:
    - docker-compose.yml
