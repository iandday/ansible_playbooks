---
#
# roles/docker_dockhand/tasks/main.yml
#

- name: create compose directory
  become: true
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ docker_uid }}"
    group: "{{ docker_gid }}"
    mode: 0700
  loop:
    - "{{ docker_dockhand_docker_builds }}"
    - "{{ docker_dockhand_ssl_dir }}"

- name: Check for dockhand ssl cert
  become: true
  stat:
    path: "{{ docker_dockhand_ssl_cert }}"
  register: dockhand_ssl_cert

- name: Read certificate information if it exists
  become: true
  community.crypto.x509_certificate_info:
    path: "{{ docker_dockhand_ssl_cert }}"
  register: cert_info
  when: dockhand_ssl_cert.stat.exists

- name: Request a new certificate from Vault PKI
  community.hashi_vault.vault_pki_generate_certificate:
    url: "{{ vault_hc_vault_url }}"
    auth_method: approle
    role_id: "{{ vault_hc_vault_ansible_runner_role_id }}"
    secret_id: "{{ vault_hc_vault_ansible_runner_secret_id }}"
    engine_mount_point: "{{ vault_hc_vault_ansible_runner_pki_engine_path }}"
    role_name: "{{ vault_hc_vault_ansible_runner_role_name }}"
    common_name: "{{ docker_dockhand_cert_cn }}"
    ttl: "7200h" 
    ip_sans:
      - "{{ ansible_host }}"
    alt_names:
      - "{{ inventory_hostname }}.{{ all_ext_domain }}" 
  when: >
    not dockhand_ssl_cert.stat.exists or 
    (cert_info.valid_at.three_weeks_and_five_days is defined and not cert_info.valid_at.three_weeks_and_five_days)
  register: vault_cert_response
  delegate_to: localhost

- name: Save the Private Key to the server
  become: true
  ansible.builtin.copy:
    content: "{{ vault_cert_response.data.data.private_key }}"
    dest: "{{ docker_dockhand_ssl_key }}"
    mode: "0600"
    owner: root
    group: root
  when: vault_cert_response.changed 

- name: Save the Certificate to the server
  become: true
  ansible.builtin.copy:
    content: "{{ vault_cert_response.data.data.certificate }}"
    dest: "{{ docker_dockhand_ssl_cert }}"
    mode: "0644"
    owner: root
    group: root
  when: vault_cert_response.changed

- name: Save the CA Chain to the server
  become: true
  ansible.builtin.copy:
    content: "{{ vault_cert_response.data.data.issuing_ca }}"
    dest: "{{  docker_dockhand_docker_builds }}/ca_chain.crt"
    mode: "0644"
    owner: root
    group: root
  when: vault_cert_response.changed

- name: copy docker files
  become: true
  template:
    src: "{{ item }}.j2"
    dest: "{{ docker_dockhand_docker_builds }}/{{ item }}"
    backup: true
    owner: "{{ docker_uid }}"
    group: "{{ docker_gid }}"
    mode: 0700
  loop:
    - docker-compose.yml

- name: start compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_dockhand_docker_builds }}"
    state: present
  become: true

- name: Check for completed flag file
  ansible.builtin.stat:
    path: "{{ docker_dockhand_docker_builds }}/.completed"
  become: true
  register: completed_flag_file

- name: Wait for Dockhand API to become responsive
  ansible.builtin.wait_for:
    port: "{{ docker_dockhand_host_port }}"
    delay: 3
    timeout: 30
  when: not completed_flag_file.stat.exists

- name: Configure Local Docker Environment Connection
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ docker_dockhand_host_port }}/api/environments"
    method: POST
    body_format: json
    body:
      name: "{{ inventory_hostname }}"
      connection_type: "socket"
      socket_path: "/var/run/docker.sock"
    status_code: [200, 201, 409]
    validate_certs: false
  delegate_to: localhost
  when: not completed_flag_file.stat.exists

- name: Create Dockhand admin user
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ docker_dockhand_host_port }}/api/users"
    method: POST
    body_format: json
    status_code: [200, 201, 409] # 409 means user already exists
    return_content: true
    headers:
      Accept: "application/json"
    body:
      username: "{{ vault_docker_dockhand_admin_username }}"
      password: "{{ vault_docker_dockhand_admin_password }}"
    validate_certs: false
  delegate_to: localhost
  register: new_dockhand_admin_user
  when: not completed_flag_file.stat.exists

- name: Force Enable Authentication in Dockhand SQLite Database
  ansible.builtin.command: >
    docker exec dockhand sqlite3 /app/data/db/dockhand.db 
    "UPDATE auth_settings SET auth_enabled = 1;"
  become: true
  changed_when: true
  when: not completed_flag_file.stat.exists

- name: Restart Dockhand to Apply Database Changes
  community.docker.docker_compose_v2:
    project_src: "{{ docker_dockhand_docker_builds }}"
    services:
      - dockhand
    state: restarted
  become: true
  when: not completed_flag_file.stat.exists

- name: Create completed flag file
  ansible.builtin.file:
    path: "{{ docker_dockhand_docker_builds }}/.completed"
    state: touch
  become: true
  when: not completed_flag_file.stat.exists
