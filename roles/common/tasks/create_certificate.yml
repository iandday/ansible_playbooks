---
#
# roles/common/tasks/create_certificate.yml
# Create certificate if missing or expiring within 30 days from Hashicorp Vault
# Call with the following variables
#  certificate_path: path to certificate file
#  certificate_key_path: path to certificate private key file
#  certificate_ca_path: path to certificate ca file
#  certificate_cn: certificate common name
#  certificate_san: list of SAN entries
#  certificate_ip_san: list of IP SAN entries
  
- name: Check for SSL cert
  become: true
  stat:
    path: "{{ certificate_path }}"
  register: dockhand_ssl_cert

- name: Read certificate information if it exists
  become: true
  community.crypto.x509_certificate_info:
    path: "{{ certificate_path }}"
  register: cert_info
  when: dockhand_ssl_cert.stat.exists

- name: Request a new certificate from Vault PKI
  community.hashi_vault.vault_pki_generate_certificate:
    url: "{{ vault_hc_vault_url }}"
    auth_method: approle
    role_id: "{{ vault_hc_vault_ansible_runner_role_id }}"
    secret_id: "{{ vault_hc_vault_ansible_runner_secret_id }}"
    engine_mount_point: "{{ vault_hc_vault_ansible_runner_pki_engine_path }}"
    role_name: "{{ vault_hc_vault_ansible_runner_role_name }}"
    common_name: "{{ certificate_cn }}"
    ttl: "7200h" 
    ip_sans: "{{ certificate_ip_san }}"
    alt_names: "{{ certificate_san }}"
  when: >
    not dockhand_ssl_cert.stat.exists or 
    (cert_info.valid_at.three_weeks_and_five_days is defined and not cert_info.valid_at.three_weeks_and_five_days)
  register: vault_cert_response
  delegate_to: localhost

- name: Save the Private Key to the server
  become: true
  ansible.builtin.copy:
    content: "{{ vault_cert_response.data.data.private_key }}"
    dest: "{{ certificate_key_path }}"
    mode: "0600"
    owner: root
    group: root
  when: vault_cert_response.changed 

- name: Save the Certificate to the server
  become: true
  ansible.builtin.copy:
    content: "{{ vault_cert_response.data.data.certificate }}"
    dest: "{{ certificate_path }}"
    mode: "0644"
    owner: root
    group: root
  when: vault_cert_response.changed

- name: Save the CA Chain to the server
  become: true
  ansible.builtin.copy:
    content: "{{ vault_cert_response.data.data.issuing_ca }}"
    dest: "{{ certificate_chain_path }}"
    mode: "0644"
    owner: root
    group: root
  when: vault_cert_response.changed